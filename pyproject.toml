[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "charm-telemetry-helloworld"
version = "0.1.0"
description = "A custom Charm telemetry exporter template"
readme = "README.md"
authors = [
    { name = "Your Name", email = "your.email@example.com" }
]
requires-python = ">=3.10"
dependencies = [
    "charmos>=0.4.0",
]

[project.entry-points."charm.telemetry"]
helloworld = "charm_telemetry_helloworld.exporter:HelloWorldExporter"

[tool.hatch.build.targets.wheel]
packages = ["src/charm_telemetry_helloworld"]
